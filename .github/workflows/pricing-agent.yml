name: pricing-agent

# تشغيل دائم: كل تشغيلة تستقبل رسائل تيليجرام قرابة 5 ساعات ونص، وبعدها تشغّل اللي بعدها.
# الجدولة كل ساعة احتياط، لو انقطعت السلسلة لأي سبب ترجع تشتغل.
on:
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"

# تشغيلة وحدة بس في نفس الوقت، عشان ما ينعالج نفس الطلب مرتين
concurrency:
  group: pricing-agent
  cancel-in-progress: false

permissions:
  contents: write  # لحفظ الحالة المشفرة في state/state.enc
  actions: write   # عشان التشغيلة تشغّل اللي بعدها

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pricing agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LOOP_MINUTES: "330"
          PYTHONUNBUFFERED: "1"
        run: python agent.py

      - name: Save state
        if: always()
        run: |
          if [ -n "$(git status --porcelain state/)" ]; then
            git config user.name "pricing-agent"
            git config user.email "pricing-agent@users.noreply.github.com"
            git add -A state/
            git commit -m "Update state [skip ci]"
            for i in 1 2 3; do
              git pull --rebase -q && git push -q && break
              sleep 5
            done
          fi

      - name: Start next run
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pricing-agent.yml --ref main
